services:
  grafana:
    container_name: 'clickhouse-apm-app'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-13.1.1}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - ${GRAFANA_PORT:-3000}:3000/tcp
    volumes:
      - ../dist:/var/lib/grafana/plugins/clickhouse-apm-app
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/clickhouse-apm-app

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.clickhouse-apm-app:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: clickhouse-apm-app
      # ClickStack local-against-prod: grafana-clickhouse-datasource + host tunnel
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    extra_hosts:
      - 'host.docker.internal:host-gateway'
