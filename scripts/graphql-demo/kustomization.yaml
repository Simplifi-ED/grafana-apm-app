apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Must be prod-nova: otel-collector-logs filter/namespace drops other k8s namespaces.
namespace: prod-nova
resources:
  - k8s/deployment.yaml
configMapGenerator:
  - name: graphql-demo-emitter
    files:
      - emit_graphql_spans.py
generatorOptions:
  disableNameSuffixHash: true
